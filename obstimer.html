<html lang=ja>
    <head>
        <meta charset="UTF-8">
        <title>obs timer</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
        <style type="text/css">
            * {
                margin: 0px;
                padding: 0px;
            }
            form {
                color: white;
                vertical-align: center;
            }
            form[name=timer]{
                font-size: 100px;
                display: flex;
            }
            input[type=number] {
                font-size: 100px;
                background-color: transparent;
                color: white;
                width: 108px;
                border: 0px;
                font-family: "WDXL Lubrifont JP N", sans-serif;
            }
            input[type=button] {
                font-size: 30px;
                height: 30px;
                border: 0px;
                background-color: #ffffff80;
                font-family: "WDXL Lubrifont JP N", sans-serif;
            }
            input[type=button]:hover {
                border: 1px solid #808080ff;
                background-color: #ffffffff;
            }
            input[type=number]:hover {
                border: 1px solid #808080;
            }
            input::-webkit-outer-spin-button,
            input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            div#operators {
                display: none;
            }
            audio {
                display: none;
            }
        </style>
        <script type="text/javascript">
            let timer = null;
            let endTime = null;
            let prevH = 0;
            let prevM = 20;
            let prevS = 0;

            function operatorSwitch(){
                let d = document.getElementById("operators");
                d.style.display = d.style.display.toLowerCase() == "block" ? "none" : "block";
            }

            function startTimer(){
                let fm = document.timer;
                let dt = new Date();
                
                prevH = fm.hour.value - 0;
                prevM = fm.min.value - 0;
                prevS = fm.sec.value - 0;

                dt.setHours(dt.getHours() + (fm.hour.value - 0));
                dt.setMinutes(dt.getMinutes() + (fm.min.value - 0));
                dt.setSeconds(dt.getSeconds() + (fm.sec.value - 0));
                endTime = dt;
                timer = setInterval(checkTimer, 250);
            }
            function checkTimer(){
                let diff = endTime.getTime() - (new Date()).getTime();
                if(diff <= 0){
                    stopTimer();
                    playAlert();
                    return;
                }
                let fm = document.timer;
                let dt = new Date(diff);
                fm.hour.value = pad0(dt.getUTCHours());
                fm.min.value = pad0(dt.getUTCMinutes());
                fm.sec.value = pad0(dt.getUTCSeconds());
            }
            function stopTimer(){
                if(timer != null)
                    clearInterval(timer);
                timer = null;
            }
            function playAlert(){
                document.getElementById("alert").play();
            }
            function resetTimer(){
                let fm = document.timer;
                fm.hour.value = pad0(prevH);
                fm.min.value = pad0(prevM);
                fm.sec.value = pad0(prevS);
            }

            function pad0(num){
                let str = ""+num+"";
                if(str.length < 2)
                    str = "0"+str;
                return str;
            }
        </script>
    </head>
    <body>
        <form name="timer">
            <input type="number" max="60" min="0" value="00" name="hour">:<input type="number" max="60" min="0" value="20" name="min">:<input type="number" max="60" min="0" value="00" name="sec"><br>
        </form>
        <form name="operator">
            <input type="button" value="▼" onclick="operatorSwitch()">
            <div id="operators">
                <input type="button" value="start" onclick="startTimer()">
                <input type="button" value="stop" onclick="stopTimer()">
                <input type="button" value="reset" onclick="resetTimer()">
            </div>
        </form>
